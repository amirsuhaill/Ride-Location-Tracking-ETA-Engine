<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚕</text></svg>"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ride-tracking</title>
  </head>
  <body>
    <div id="root"></div>
    <!--
      A real route on core (Frontend Phase 10, docs/frontend-deploy.md) when this app is served by
      core itself — sets window.__RUNTIME_CONFIG__ before src/config.ts (or any other app code)
      ever runs. A plain script (no type="module"), so it executes immediately as parsed, ahead of
      the deferred module script below, regardless of tag order. In dev mode (`npm run dev`) this
      path simply doesn't exist — the browser logs a harmless 404 for it and config.ts's own
      fallback to Vite's `import.meta.env` takes over, exactly as before this phase.
    -->
    <script src="/runtime-config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
